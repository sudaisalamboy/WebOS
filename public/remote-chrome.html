<!DOCTYPE html>
<html lang="en" class="noVNC_loading">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Chrome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        #top_bar { display: none; }
        #screen { width: 100%; height: 100%; }
        /* Force the noVNC canvas to fill the full width AND height of the
           container. noVNC's scaleViewport keeps the aspect ratio and
           letterboxes (black bars) when the aspect ratios don't match.
           This override makes the canvas stretch to fill the entire
           viewport so the browser width fits the canvas width. */
        #screen canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
        }
        #status {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #67c5d4; font-size: 18px; text-align: center; z-index: 100;
        }
        #status::before {
            content: ''; display: block; width: 40px; height: 40px; margin: 0 auto 16px;
            border: 3px solid rgba(103, 197, 212, 0.2); border-top-color: #67c5d4;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="status">Loading Remote Chrome…</div>
    <div id="screen"></div>

    <script type="module">
        import RFB from '/api/vnc/core/rfb.js';

        function status(msg) {
            document.getElementById('status').textContent = msg;
        }

        function readQueryVariable(name, defaultValue) {
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)');
            const match = document.location.href.match(re);
            if (match) return decodeURIComponent(match[1]);
            return defaultValue || null;
        }

        const host = window.location.hostname;
        const port = window.location.port;
        // The WebSocket path includes XTransformPort so Caddy routes it to websockify (port 6080)
        const wsPath = readQueryVariable('path', 'websockify?XTransformPort=6080');
        const password = readQueryVariable('password');
        const scale = readQueryVariable('scale', 'true') === 'true';
        // resizeSession: ask the VNC server to resize its display to match
        // the local viewport size. This eliminates black bars / distortion
        // because the remote desktop matches the canvas exactly.
        const resize = readQueryVariable('resize', 'true') === 'true';

        // Build WebSocket URL — goes through Caddy proxy with XTransformPort=6080
        let url = window.location.protocol === 'https:' ? 'wss' : 'ws';
        url += '://' + host;
        if (port) url += ':' + port;
        url += '/' + wsPath;

        let rfb = null;
        let reconnectTimer = null;
        let reconnectAttempts = 0;

        // Attach all event handlers to an RFB instance. Used both for the
        // initial connection and for auto-reconnects so we don't duplicate code.
        function attachHandlers(instance) {
            instance.scaleViewport = scale;
            instance.resizeSession = resize;
            instance.addEventListener('connect', (e) => {
                status('');
                reconnectAttempts = 0;  // reset on successful connect
                document.documentElement.classList.remove('noVNC_loading');
            });

            instance.addEventListener('disconnect', (e) => {
                if (e.detail.clean) {
                    status('Disconnected');
                    return;  // clean disconnect — don't auto-reconnect
                }
                // Unclean disconnect: the VNC server (x11vnc) or Chrome may
                // have briefly restarted. Retry every 3s up to 20 times so
                // users don't get stuck on a dead "disconnected" screen.
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts++;
                if (reconnectAttempts <= 20) {
                    status('Connection lost. Reconnecting in 3s (attempt ' + reconnectAttempts + '/20)…');
                    reconnectTimer = setTimeout(() => {
                        try { instance.disconnect(); } catch (e) {}
                        try {
                            rfb = new RFB(document.getElementById('screen'), url,
                                { credentials: { password: password } });
                            attachHandlers(rfb);
                        } catch (e) {
                            status('Reconnect failed: ' + e.message + ' — retrying…');
                        }
                    }, 3000);
                } else {
                    status('Could not reconnect after 20 attempts. Reload the page.');
                }
            });

            instance.addEventListener('credentialsrequired', (e) => {
                status('Password required — add &password=YOUR_PASSWORD to URL');
            });

            instance.addEventListener('desktopname', (e) => {
                document.title = 'Remote Chrome — ' + e.detail.name;
            });
        }

        status('Connecting to Remote Chrome…');
        rfb = new RFB(document.getElementById('screen'), url,
            { credentials: { password: password } });
        attachHandlers(rfb);
    </script>
</body>
</html>
